name: Rust

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format workspace
        run: cargo fmt --all -- --check

      - name: Format desktop crate
        run: cargo fmt --manifest-path crates/app/src-tauri/Cargo.toml -- --check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.os }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Shell smoke (headless start, backup)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cargo run -q -p socdof-app -- \
            --database "$RUNNER_TEMP/socdof.db" \
            --backup "$RUNNER_TEMP/socdof.socdofbak"
          test -s "$RUNNER_TEMP/socdof.socdofbak"

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install macOS Rust targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./crates/app/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache desktop cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: |
            crates/app/src-tauri -> target
          key: desktop-${{ matrix.os }}

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/app/package-lock.json

      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            xdotool \
            libssl-dev \
            patchelf \
            xvfb \
            xauth \
            dbus-x11

      - name: Install frontend dependencies
        working-directory: crates/app
        run: npm ci

      - name: Build frontend
        working-directory: crates/app
        run: npm run build

      - name: Format desktop crate
        run: cargo fmt --manifest-path crates/app/src-tauri/Cargo.toml -- --check

      - name: Build Tauri bundles
        working-directory: crates/app
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            npm run tauri -- build --target universal-apple-darwin
          else
            npm run tauri -- build
          fi

      - name: Stage Linux release artifacts
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.value }}'
          mkdir -p artifacts
          appimage=$(find crates/app/src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          deb=$(find crates/app/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$appimage"
          test -n "$deb"
          cp "$appimage" "artifacts/SOCDOF-${version}-linux-x86_64.AppImage"
          cp "$deb" "artifacts/SOCDOF-${version}-linux-amd64.deb"
          chmod +x "artifacts/SOCDOF-${version}-linux-x86_64.AppImage"
          test "$(stat -c%s "artifacts/SOCDOF-${version}-linux-x86_64.AppImage")" -gt 1000000
          test "$(stat -c%s "artifacts/SOCDOF-${version}-linux-amd64.deb")" -gt 1000000
          sha256sum artifacts/SOCDOF-* > artifacts/SHA256SUMS-linux.txt
          ls -lh artifacts

      - name: Check installer size budgets
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-budgets.mjs --scope=artifacts | tee artifacts/installer-budgets.txt
          {
            echo '### Installer size budgets'
            echo '```text'
            cat artifacts/installer-budgets.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Frame budget (50k contacts, 100k invoices)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release -p socdof-ui --test performance -- --ignored --nocapture | tee artifacts/frame-budget.txt
          {
            echo '### Frame budget'
            echo '```text'
            cat artifacts/frame-budget.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage Windows release artifacts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.value }}'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $release = 'crates/app/src-tauri/target/release'
          $exe = Join-Path $release 'socdof-desktop.exe'
          if (-not (Test-Path $exe)) { throw "Missing built binary: $exe" }

          $portable = Join-Path 'artifacts' "SOCDOF-$version-windows-x64-portable"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item $exe $portable
          Copy-Item 'crates/app/portable/README-PORTABLE.txt' $portable
          $loader = Join-Path $release 'WebView2Loader.dll'
          if (Test-Path $loader) { Copy-Item $loader $portable }
          Compress-Archive -Path (Join-Path $portable '*') `
            -DestinationPath "artifacts/SOCDOF-$version-windows-x64-portable.zip" -Force

          $nsis = Get-ChildItem 'crates/app/src-tauri/target/release/bundle/nsis/*-setup.exe' |
            Select-Object -First 1
          $msi = Get-ChildItem 'crates/app/src-tauri/target/release/bundle/msi/*.msi' |
            Select-Object -First 1
          if (-not $nsis) { throw 'NSIS setup executable was not produced' }
          if (-not $msi) { throw 'MSI installer was not produced' }
          Copy-Item $nsis.FullName "artifacts/SOCDOF-$version-windows-x64-setup.exe"
          Copy-Item $msi.FullName "artifacts/SOCDOF-$version-windows-x64.msi"

          Get-ChildItem artifacts -File | ForEach-Object {
            if ($_.Length -lt 1000) { throw "Artifact is implausibly small: $($_.Name)" }
            "{0} {1}" -f $_.Name, $_.Length
          }
          Get-ChildItem artifacts -File -Filter 'SOCDOF-*' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "{0}  {1}" -f $hash, $_.Name
          } | Set-Content artifacts/SHA256SUMS-windows.txt
          Get-ChildItem artifacts | Select-Object Name, Length

      - name: Stage macOS release artifacts
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.value }}'
          mkdir -p artifacts
          dmg=$(find crates/app/src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          cp "$dmg" "artifacts/SOCDOF-${version}-macos-universal.dmg"
          test "$(wc -c < "artifacts/SOCDOF-${version}-macos-universal.dmg")" -gt 1000000
          shasum -a 256 artifacts/SOCDOF-* > artifacts/SHA256SUMS-macos.txt
          ls -lh artifacts

      - name: Upload Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v6
        with:
          name: SOCDOF-${{ steps.version.outputs.value }}-linux-x86_64.AppImage
          path: artifacts/SOCDOF-${{ steps.version.outputs.value }}-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux Debian package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v6
        with:
          name: SOCDOF-${{ steps.version.outputs.value }}-linux-amd64.deb
          path: artifacts/SOCDOF-${{ steps.version.outputs.value }}-linux-amd64.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux checksums
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v6
        with:
          name: SOCDOF-${{ steps.version.outputs.value }}-linux-SHA256SUMS
          path: artifacts/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows portable ZIP
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: SOCDOF-${{ steps.version.outputs.value }}-windows-x64-portable
          path: artifacts/SOCDOF-${{ steps.version.outputs.value }}-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows NSIS setup
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: SOCDOF-${{ steps.version.outputs.value }}-windows-x64-setup
          path: artifacts/SOCDOF-${{ steps.version.outputs.value }}-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows MSI
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: SOCDOF-${{ steps.version.outputs.value }}-windows-x64-msi
          path: artifacts/SOCDOF-${{ steps.version.outputs.value }}-windows-x64.msi
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows checksums
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: SOCDOF-${{ steps.version.outputs.value }}-windows-SHA256SUMS
          path: artifacts/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS DMG
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v6
        with:
          name: SOCDOF-${{ steps.version.outputs.value }}-macos-universal.dmg
          path: artifacts/SOCDOF-${{ steps.version.outputs.value }}-macos-universal.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS checksums
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v6
        with:
          name: SOCDOF-${{ steps.version.outputs.value }}-macos-SHA256SUMS
          path: artifacts/SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: 14

  gui-smoke:
    name: GUI smoke (Linux, Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache GUI smoke cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: |
            crates/app/src-tauri -> target
          key: gui-smoke

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/app/package-lock.json

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            xvfb \
            xauth \
            dbus-x11 \
            libgl1-mesa-dri

      - name: Install frontend dependencies
        working-directory: crates/app
        run: npm ci

      - name: Build frontend
        working-directory: crates/app
        run: npm run build

      - name: Build native Rust desktop host
        run: cargo check -p socdof-ui --features window --bin socdof-ui-desktop

      - name: Build Tauri binary
        working-directory: crates/app
        run: npm run tauri -- build --no-bundle

      - name: Idle RAM/CPU budget
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          Xvfb :99 -screen 0 1280x800x24 > artifacts/xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          sleep 2
          export DISPLAY=:99
          export XDG_DATA_HOME="$PWD/artifacts/xdg-idle"
          export GDK_BACKEND=x11
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          export LIBGL_ALWAYS_SOFTWARE=1
          export NO_AT_BRIDGE=1
          export APP_BIN="$PWD/crates/app/src-tauri/target/release/socdof-desktop"
          mkdir -p artifacts xdg-ignore
          app_pid=$(python3 scripts/idle-app-pid.py)
          echo "sampled app pid: $app_pid"
          sleep 15
          node scripts/check-budgets.mjs --scope=runtime --pid "$app_pid" | tee artifacts/runtime-budgets.txt
          kill "$app_pid" 2>/dev/null || true
          sleep 1
          {
            echo '### Idle RAM/CPU budgets'
            echo '```text'
            cat artifacts/runtime-budgets.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run real Tauri app under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          export SOCDOF_SMOKE_REPORT="$PWD/artifacts/smoke-report.json"
          export XDG_DATA_HOME="$PWD/artifacts/xdg-data"
          export GDK_BACKEND=x11
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          export LIBGL_ALWAYS_SOFTWARE=1
          export NO_AT_BRIDGE=1

          set +e
          timeout 120s dbus-run-session -- xvfb-run -a --server-args="-screen 0 1280x800x24" \
            "$PWD/crates/app/src-tauri/target/release/socdof-desktop" \
            > artifacts/smoke.log 2>&1
          smoke_status=$?
          set -e
          echo "Tauri smoke process exited with $smoke_status"
          cat artifacts/smoke.log
          if [ -f artifacts/smoke.log ]; then
            {
              echo '### GUI smoke runtime log'
              echo '```text'
              tail -n 80 artifacts/smoke.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          test "$smoke_status" -eq 0
          test -s artifacts/smoke-report.json

          python3 - <<'PY'
          import json
          import pathlib

          report = json.loads(pathlib.Path("artifacts/smoke-report.json").read_text())
          log = pathlib.Path("artifacts/smoke.log").read_text(errors="replace")

          assert isinstance(report.get("schema_version"), int), report
          assert report["schema_version"] > 0, report
          database = pathlib.Path(report["database"])
          assert database.is_file(), f"database does not exist: {database}"
          backup = pathlib.Path(report["backup_path"])
          assert backup.is_file(), f"backup does not exist: {backup}"
          assert report["backup_bytes"] > 0, report
          assert backup.stat().st_size == report["backup_bytes"], report
          assert report.get("contact_name") == "GUI Smoke Kontakt", report
          assert report.get("product_sku") == "SMOKE-GUI-001", report
          assert isinstance(report.get("contact_count"), int), report
          assert isinstance(report.get("product_count"), int), report
          assert report["contact_count"] >= 1, report
          assert report["product_count"] >= 1, report
          for marker in (
              "SOCDOF_SMOKE database_status",
              "SOCDOF_SMOKE create_backup",
              "SOCDOF_SMOKE create_contact",
              "SOCDOF_SMOKE update_contact",
              "SOCDOF_SMOKE create_product",
              "SOCDOF_SMOKE update_product",
              "SOCDOF_SMOKE_OK",
          ):
              assert marker in log, f"missing runtime marker: {marker}"
          assert "GUI Smoke Kontakt" in log, "contact was not rendered in the smoke run"
          assert "SMOKE-GUI-001" in log, "product was not rendered in the smoke run"
          print(
              "GUI smoke OK:",
              f"schema={report['schema_version']}",
              f"contacts={report['contact_count']}",
              f"products={report['product_count']}",
              f"database={database}",
              f"backup={backup}",
              f"bytes={report['backup_bytes']}",
          )
          PY

          smoke_result=$(grep 'SOCDOF_SMOKE_OK' artifacts/smoke.log | tail -n 1)
          test -n "$smoke_result"
          echo "::notice title=GUI smoke runtime::$smoke_result"
          {
            echo '### GUI smoke runtime'
            echo '```text'
            grep 'SOCDOF_SMOKE' artifacts/smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Splash handshake
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          export XDG_DATA_HOME="$PWD/artifacts/xdg-splash"
          export GDK_BACKEND=x11
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          export LIBGL_ALWAYS_SOFTWARE=1
          export NO_AT_BRIDGE=1
          app_bin="$PWD/crates/app/src-tauri/target/release/socdof-desktop"
          SOCDOF_SMOKE_REPORT="$PWD/artifacts/splash-report.json" \
            timeout 120s dbus-run-session -- xvfb-run -a --server-args="-screen 0 1280x800x24" \
              "$app_bin" > artifacts/splash.log 2>&1
          set +e
          SOCDOF_SMOKE_FAIL_STARTUP=1 SOCDOF_SMOKE_REPORT="$PWD/artifacts/splash-failure-report.json" \
            timeout 25s dbus-run-session -- xvfb-run -a --server-args="-screen 0 1280x800x24" \
              "$app_bin" > artifacts/splash-failure.log 2>&1
          set -e
          python3 - <<'PY'
          import pathlib

          ok = pathlib.Path("artifacts/splash.log").read_text(errors="replace")
          failed = pathlib.Path("artifacts/splash-failure.log").read_text(errors="replace")

          assert "SOCDOF_SPLASH phase=starting" in ok, "no starting phase in the normal run"
          assert "SOCDOF_SPLASH phase=ready" in ok, "the shell never reported ready"
          assert "SOCDOF_SPLASH splash_window=closed" in ok, "the splash was not closed"
          assert "SOCDOF_SPLASH main_window=visible error=-" in ok, "the main window was not shown"
          assert ok.index("phase=starting") < ok.index("phase=ready"), "ready before starting"
          assert ok.index("splash_window=closed") < ok.index("main_window=visible"), (
              "main window shown before the splash closed"
          )
          assert ok.index("phase=ready") < ok.index("SOCDOF_SMOKE_OK"), (
              "the smoke contract ran before the shell was ready"
          )

          assert "SOCDOF_SPLASH phase=failed" in failed, "the failure path left the splash open"
          assert "reason=database_error" in failed, "the failure reason was not reported"
          assert "SOCDOF_SPLASH splash_window=closed" in failed, "failure did not close the splash"
          assert "main_window=visible error=database_error" in failed, (
              "failure did not show the error state"
          )
          assert failed.index("phase=starting") < failed.index("phase=failed"), "failure before start"
          print("splash handshake OK")
          PY
          {
            echo '### Splash handshake'
            echo '```text'
            grep 'SOCDOF_SPLASH' artifacts/splash.log artifacts/splash-failure.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Native dialog bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/dialog-target
          echo '{}' > artifacts/dialog-target/import.json
          export XDG_DATA_HOME="$PWD/artifacts/xdg-dialogs"
          export GDK_BACKEND=x11
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          export LIBGL_ALWAYS_SOFTWARE=1
          export NO_AT_BRIDGE=1
          export SOCDOF_SMOKE_DIALOGS=1
          export SOCDOF_SMOKE_DIALOG_FOLDER="$PWD/artifacts/dialog-target"
          export SOCDOF_SMOKE_DIALOG_OPEN="$PWD/artifacts/dialog-target/import.json"
          export SOCDOF_SMOKE_DIALOG_SAVE="$PWD/artifacts/dialog-target/missing/backup.socdofbak"
          SOCDOF_SMOKE_REPORT="$PWD/artifacts/dialogs-report.json" \
            timeout 120s dbus-run-session -- xvfb-run -a --server-args="-screen 0 1280x800x24" \
              "$PWD/crates/app/src-tauri/target/release/socdof-desktop" > artifacts/dialogs.log 2>&1
          python3 - <<'PY'
          import pathlib

          log = pathlib.Path("artifacts/dialogs.log").read_text(errors="replace")

          assert "SOCDOF_DIALOG kind=folder outcome=chosen" in log, "folder picker rejected a folder"
          assert "SOCDOF_DIALOG kind=open_file outcome=chosen" in log, "open dialog rejected a file"
          assert "SOCDOF_DIALOG kind=save_file outcome=error reason=parent_missing" in log, (
              "save dialog accepted a missing parent folder"
          )
          assert "SOCDOF_DIALOG kind=folder outcome=cancelled" in log, "cancel was not reported"
          assert "SOCDOF_DIALOG kind=message outcome=acknowledged" in log, "message was not acknowledged"
          print("dialog bridge OK")
          PY
          {
            echo '### Native dialog bridge'
            echo '```text'
            grep 'SOCDOF_DIALOG' artifacts/dialogs.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: System tray menu
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          export XDG_DATA_HOME="$PWD/artifacts/xdg-tray"
          export LANG=de_DE.UTF-8
          export GDK_BACKEND=x11
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          export LIBGL_ALWAYS_SOFTWARE=1
          export NO_AT_BRIDGE=1
          export SOCDOF_SMOKE_TRAY=1
          SOCDOF_SMOKE_REPORT="$PWD/artifacts/tray-report.json" \
            timeout 120s dbus-run-session -- xvfb-run -a --server-args="-screen 0 1280x800x24" \
              "$PWD/crates/app/src-tauri/target/release/socdof-desktop" > artifacts/tray.log 2>&1
          python3 - <<'PY'
          import pathlib

          log = pathlib.Path("artifacts/tray.log").read_text(errors="replace")
          assert "SOCDOF_TRAY item=show action=show_window" in log, "the window action did not run"
          assert "SOCDOF_SPLASH main_window=visible error=-" in log, (
              "the window action did not show the window"
          )
          assert "SOCDOF_TRAY item=backup action=create_backup" in log, "the backup action did not run"
          assert "SOCDOF_TRAY backup path=" in log, "the backup action reported no file"
          assert "bytes=0" not in log, "the backup action wrote an empty file"
          assert "SOCDOF_TRAY item=quit action=quit" in log, "the quit action did not run"
          assert "SOCDOF_TRAY item=unknown action=none" in log, "an unknown menu id dispatched"
          for label in (
              "lang=de item=show label=Fenster anzeigen",
              "lang=en item=show label=Show window",
              "lang=fr item=show label=Afficher la fenêtre",
              "lang=es item=show label=Mostrar ventana",
          ):
              assert label in log, f"missing tray label: {label}"
          assert log.index("action=show_window") < log.index("action=create_backup"), (
              "menu order changed"
          )
          assert log.index("action=create_backup") < log.index("action=quit"), "menu order changed"
          print("tray menu OK")
          PY
          {
            echo '### System tray menu'
            echo '```text'
            grep 'SOCDOF_TRAY' artifacts/tray.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Shortcut dispatch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          export GDK_BACKEND=x11
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          export LIBGL_ALWAYS_SOFTWARE=1
          export NO_AT_BRIDGE=1
          app_bin="$PWD/crates/app/src-tauri/target/release/socdof-desktop"

          run_keys() {
            local label="$1" locked="$2" log="$3"
            local xdg="$PWD/artifacts/xdg-keys-$label"
            mkdir -p "$xdg"
            Xvfb :91 -screen 0 1280x800x24 > "artifacts/xvfb-$label.log" 2>&1 &
            local xvfb_pid=$!
            sleep 2
            local app_pid=""
            (
              export DISPLAY=:91
              export XDG_DATA_HOME="$xdg"
              export SOCDOF_SMOKE_REPORT="$PWD/artifacts/keys-$label-report.json"
              export SOCDOF_SMOKE_IDLE=1
              if [ "$locked" = "locked" ]; then
                export SOCDOF_SMOKE_LOCKED=1
              fi
              "$app_bin"
            ) > "$log" 2>&1 &
            app_pid=$!
            local window=""
            for _ in $(seq 1 40); do
              window=$(DISPLAY=:91 xdotool search --onlyvisible --name SOCDOF 2>/dev/null | head -n 1 || true)
              if [ -n "$window" ]; then
                break
              fi
              sleep 1
            done
            if [ -z "$window" ]; then
              echo "no SOCDOF window appeared for $label"
              cat "$log"
              kill "$app_pid" "$xvfb_pid" 2>/dev/null || true
              return 1
            fi
            DISPLAY=:91 xdotool windowfocus "$window" 2>/dev/null || true
            sleep 1
            DISPLAY=:91 xdotool key --window "$window" F11 || true
            sleep 1
            DISPLAY=:91 xdotool key --window "$window" F12 || true
            sleep 1
            kill "$app_pid" "$xvfb_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }

          run_keys ready ready artifacts/keys-ready.log
          run_keys locked locked artifacts/keys-locked.log

          python3 - <<'PY'
          import pathlib

          ready = pathlib.Path("artifacts/keys-ready.log").read_text(errors="replace")
          locked = pathlib.Path("artifacts/keys-locked.log").read_text(errors="replace")

          assert "SOCDOF_SHORTCUT chord=F11 action=toggle_fullscreen" in ready, (
              "F11 did not resolve to the fullscreen action"
          )
          assert "SOCDOF_SHORTCUT chord=other action=none reason=unknown" in ready, (
              "an unbound key was not ignored"
          )
          assert "reason=locked" in locked, "a locked context still ran a shortcut"
          assert "action=toggle_fullscreen" not in locked, "the locked run performed F11"
          print("shortcut dispatch OK")
          PY
          {
            echo '### Shortcut dispatch'
            echo '```text'
            grep 'SOCDOF_SHORTCUT' artifacts/keys-ready.log artifacts/keys-locked.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Window state round trip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          export XDG_DATA_HOME="$PWD/artifacts/xdg-window"
          export GDK_BACKEND=x11
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          export LIBGL_ALWAYS_SOFTWARE=1
          export NO_AT_BRIDGE=1
          app_bin="$PWD/crates/app/src-tauri/target/release/socdof-desktop"
          for run in 1 2; do
            if ! SOCDOF_SMOKE_REPORT="$PWD/artifacts/window-report-$run.json" \
              timeout 120s dbus-run-session -- xvfb-run -a --server-args="-screen 0 1280x800x24" \
                "$app_bin" > "artifacts/window-$run.log" 2>&1; then
              echo "window state run $run failed"
              cat "artifacts/window-$run.log"
              exit 1
            fi
          done
          state_file=$(find "$XDG_DATA_HOME" -name window_state.json -print -quit)
          test -n "$state_file"
          test -s "$state_file"
          python3 - "$state_file" <<'PY'
          import json
          import pathlib
          import sys

          state = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert state["schema_version"] == 1, state
          main = state["main"]
          for key in ("x", "y", "width", "height", "maximized", "fullscreen"):
              assert key in main, f"missing {key} in {main}"
          assert main["width"] >= 760 and main["height"] >= 560, main
          first = pathlib.Path("artifacts/window-1.log").read_text(errors="replace")
          second = pathlib.Path("artifacts/window-2.log").read_text(errors="replace")
          assert "SOCDOF_WINDOW state_restored" in first, "first run wrote no restore marker"
          assert "source=default" in first, "first run must start from the default geometry"
          assert "source=file" in second, "second run must restore the stored file"
          print("window state OK:", main)
          PY
          {
            echo '### Window state round trip'
            echo '```text'
            grep 'SOCDOF_WINDOW' artifacts/window-1.log artifacts/window-2.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload GUI smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: socdof-gui-smoke
          path: |
            artifacts/smoke.log
            artifacts/smoke-report.json
            artifacts/window-*.log
            artifacts/window-report-*.json
            artifacts/splash.log
            artifacts/splash-failure.log
            artifacts/keys-*.log
            artifacts/dialogs.log
            artifacts/xdg-data/**/backups/*.socdofbak
          if-no-files-found: warn
          retention-days: 14

  web:
    name: Web (wasm, Trunk)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          key: web

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - name: Build web bundle
        working-directory: crates/web
        run: trunk build --release

      - name: Check the bundle
        shell: bash
        working-directory: crates/web
        run: |
          set -euo pipefail
          test -s dist/index.html
          wasm=$(find dist -name '*.wasm' -print -quit)
          test -n "$wasm"
          bytes=$(stat -c%s "$wasm")
          echo "wasm bundle: $bytes bytes"
          test "$bytes" -gt 1000000

      - name: Upload web bundle
        uses: actions/upload-artifact@v6
        with:
          name: socdof-web
          path: crates/web/dist
          if-no-files-found: error
          retention-days: 14
