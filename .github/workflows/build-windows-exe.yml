name: Build & Publish Windows .EXE Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Release Metadata & Notes
        id: prep
        run: node scripts/prepare-release.cjs

      - name: Ensure Main Major Tag Exists (e.g. v20)
        shell: bash
        run: |
          MAJOR_TAG="${{ steps.prep.outputs.major_tag }}"
          echo "Main Major Tag is: $MAJOR_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$MAJOR_TAG" >/dev/null 2>&1 && ! git ls-remote --tags origin "$MAJOR_TAG" | grep -q "refs/tags/$MAJOR_TAG"; then
            echo "Major tag $MAJOR_TAG does not exist yet on remote. Creating and pushing tag $MAJOR_TAG..."
            git tag "$MAJOR_TAG"
            git push origin "$MAJOR_TAG" || echo "Tag push warning, continuing..."
          else
            echo "Major tag $MAJOR_TAG already exists. Updating tag $MAJOR_TAG to latest commit..."
            git tag -f "$MAJOR_TAG"
            git push -f origin "$MAJOR_TAG" || echo "Force tag push warning, continuing..."
          fi

      - name: Install dependencies
        run: |
          npm install
          npm install --save-dev electron electron-builder

      - name: Build Web Frontend (Vite)
        run: npm run build

      - name: Package Windows .EXE with Electron Builder
        run: npx --yes electron-builder --win --x64 --config electron-builder.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SOCDOF-Windows-Installer
          path: release/*.exe

      - name: Publish GitHub Release (Always to Major Tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.major_tag }}
          name: SOCDOF ${{ steps.prep.outputs.major_tag }} (${{ steps.prep.outputs.version_tag }})
          body_path: release_notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

