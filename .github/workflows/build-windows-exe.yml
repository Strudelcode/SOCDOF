name: Build & Publish Windows .EXE Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Release Metadata & Notes
        id: prep
        run: node scripts/prepare-release.cjs

      - name: Tag Release Commit
        shell: bash
        run: |
          VERSION_TAG="${{ steps.prep.outputs.version_tag }}"
          echo "Target Version Tag: $VERSION_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$VERSION_TAG" >/dev/null 2>&1 && ! git ls-remote --tags origin "$VERSION_TAG" | grep -q "refs/tags/$VERSION_TAG"; then
            echo "Tag $VERSION_TAG does not exist yet. Creating and pushing tag $VERSION_TAG..."
            git tag "$VERSION_TAG"
            git push origin "$VERSION_TAG" || echo "Tag push notice: continuing to release step..."
          else
            echo "Tag $VERSION_TAG already exists."
          fi

      - name: Install dependencies
        run: |
          npm install
          npm install --save-dev electron electron-builder

      - name: Build Web Frontend (Vite)
        run: npm run build

      - name: Package Windows .EXE with Electron Builder
        run: npx --yes electron-builder --win --x64 --config electron-builder.json --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SOCDOF-Windows-Installer
          path: release/*.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.version_tag }}
          name: SOCDOF ${{ steps.prep.outputs.version_tag }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ steps.prep.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.prep.outputs.make_latest }}
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Broadcast Release to Discord Webhook
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_TAG: ${{ steps.prep.outputs.version_tag }}
          RELEASE_NAME: SOCDOF ${{ steps.prep.outputs.version_tag }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.prep.outputs.version_tag }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Notice: DISCORD_WEBHOOK secret is not configured or empty. Skipping Discord broadcast."
            exit 0
          fi

          python3 - << 'EOF'
          import os
          import json
          import time
          import urllib.request
          import urllib.error

          webhook_url = os.environ.get("DISCORD_WEBHOOK", "").strip()
          tag = os.environ.get("RELEASE_TAG", "")
          name = os.environ.get("RELEASE_NAME", "") or tag
          url = os.environ.get("RELEASE_URL", "")
          current_timestamp = int(time.time())

          body = ""
          if os.path.exists("release_notes.md"):
              with open("release_notes.md", "r", encoding="utf-8") as f:
                  body = f.read().strip()

          header = f"# 🚀 **SOCDOF Release {tag}**\n### Veröffentlicht am <t:{current_timestamp}:D> (<t:{current_timestamp}:R>)\n---\n## **{name}**\n\n"
          footer = f"\n\n---\n🔗 **GitHub Release & Downloads (.EXE):** [Hier ansehen & herunterladen]({url})"

          max_body_len = 1900 - len(header) - len(footer)
          if len(body) > max_body_len:
              trimmed_body = body[:max_body_len].rsplit("\n", 1)[0] + f"\n\n*(...Vollständigen Changelog auf GitHub lesen)*"
          else:
              trimmed_body = body

          content = f"{header}{trimmed_body}{footer}"

          payload = {
              "username": "SOCDOF Releases",
              "avatar_url": "https://raw.githubusercontent.com/Strudelcode/SOCDOF/main/public/favicon.ico",
              "content": content
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Mozilla/5.0 (compatible; DiscordBot/1.0; +https://github.com)"
              }
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"Discord notification successfully sent! Status: {resp.status}")
          except urllib.error.HTTPError as e:
              err_body = e.read().decode('utf-8', errors='ignore')
              print(f"::warning::Discord Webhook HTTP Error: {e.code} - {err_body}")
          except Exception as e:
              print(f"::warning::Failed to post to Discord webhook: {e}")
          EOF

