name: Build & Publish Windows .EXE Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Release Metadata & Notes
        id: prep
        run: node scripts/prepare-release.cjs

      - name: Tag Release Commit
        shell: bash
        run: |
          VERSION_TAG="${{ steps.prep.outputs.version_tag }}"
          echo "Target Version Tag: $VERSION_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$VERSION_TAG" >/dev/null 2>&1 && ! git ls-remote --tags origin "$VERSION_TAG" | grep -q "refs/tags/$VERSION_TAG"; then
            echo "Tag $VERSION_TAG does not exist yet. Creating and pushing tag $VERSION_TAG..."
            git tag "$VERSION_TAG"
            git push origin "$VERSION_TAG" || echo "Tag push notice: continuing to release step..."
          else
            echo "Tag $VERSION_TAG already exists."
          fi

      - name: Install dependencies
        run: |
          npm install
          npm install --save-dev electron electron-builder

      - name: Build Web Frontend (Vite)
        run: npm run build

      - name: Package Windows .EXE with Electron Builder
        run: npx --yes electron-builder --win --x64 --config electron-builder.json --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SOCDOF-Windows-Installer
          path: release/*.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.version_tag }}
          name: SOCDOF ${{ steps.prep.outputs.version_tag }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ steps.prep.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.prep.outputs.make_latest }}
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Broadcast Release to Discord Webhook
        id: discord
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_THREAD_ID: ${{ secrets.DISCORD_THREAD_ID || '' }}
          RELEASE_TAG: ${{ steps.prep.outputs.version_tag }}
          RELEASE_NAME: SOCDOF ${{ steps.prep.outputs.version_tag }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.prep.outputs.version_tag }}
        shell: bash
        run: |
          python3 scripts/discord_broadcast.py

      - name: Commit and Push Reset CHANGELOG.md
        if: success() && steps.discord.outputs.broadcast_sent == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(changelog): reset CHANGELOG.md after Discord broadcast [skip ci]"
            git push origin HEAD || echo "Push completed or branch up to date."
          else
            echo "CHANGELOG.md was already clean or unchanged."
          fi


