name: Native Windows Installer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-windows-installer.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/test-native-windows-installer.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and smoke-test Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          key: native-windows-installer

      - name: Resolve application version
        id: version
        shell: pwsh
        run: |
          $package = Get-Content crates/app/package.json -Raw | ConvertFrom-Json
          "value=$($package.version)" >> $env:GITHUB_OUTPUT

      - name: Build native Rust desktop executable
        run: cargo build --release -p socdof-ui --features window --bin socdof-ui-desktop

      # The NSIS script packs WebView2Loader.dll and the Evergreen bootstrapper from
      # SOURCE_DIR; cargo builds neither, so they are staged with pinned checksums.
      - name: Prepare WebView2 files for the installer
        shell: pwsh
        run: ./scripts/prepare-windows-installer.ps1 -SourceDir target/release

      # Signing needs a certificate with SmartScreen reputation; without one the
      # script only warns and the build continues unsigned.
      - name: Sign the desktop executable
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: ./scripts/sign-windows-artifacts.ps1 -Paths target/release/socdof-ui-desktop.exe

      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nsis = "C:\Program Files (x86)\NSIS"
          $compiler = Join-Path $nsis "makensis.exe"
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install nsis --no-progress -y
          }
          if (-not (Test-Path -LiteralPath $compiler)) {
            throw "NSIS compiler was not installed at the expected path: $compiler"
          }
          $nsis >> $env:GITHUB_PATH
          & $compiler /VERSION
          if ($LASTEXITCODE -ne 0) { throw "NSIS compiler failed its version check" }

      - name: Create Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $version = '${{ steps.version.outputs.value }}'
          $installer = Join-Path (Resolve-Path artifacts).Path "SOCDOF-$version-windows-x64-native-setup.exe"
          $source = (Resolve-Path target/release).Path
          $compiler = "C:\Program Files (x86)\NSIS\makensis.exe"
          & $compiler "/DAPP_VERSION=$version" "/DSOURCE_DIR=$source" "/DOUTPUT_FILE=$installer" "crates/app/installer/native-windows.nsi"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $installer)) {
            throw "Native NSIS installer build failed"
          }
          ./scripts/test-native-windows-installer.ps1 -InstallerPath $installer

      - name: Sign the installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: ./scripts/sign-windows-artifacts.ps1 -Paths (Get-ChildItem artifacts -Filter '*native-setup.exe' | ForEach-Object FullName)

      - name: Create Windows portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.value }}'
          $name = "SOCDOF-$version-windows-x64-native-portable"
          $stage = Join-Path 'artifacts' $name
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item 'target/release/socdof-ui-desktop.exe' $stage
          Copy-Item 'target/release/WebView2Loader.dll' $stage
          Copy-Item 'crates/app/portable/run-socdof.cmd' $stage
          Copy-Item 'crates/app/portable/README-PORTABLE.txt' (Join-Path $stage 'README.txt')
          Compress-Archive -Path $stage -DestinationPath "artifacts/$name.zip" -Force
          if (-not (Test-Path "artifacts/$name.zip")) { throw 'portable package was not written' }

      - name: Upload tested packages
        uses: actions/upload-artifact@v6
        with:
          name: SOCDOF-Windows-v${{ steps.version.outputs.value }}
          path: |
            artifacts/SOCDOF-*-windows-x64-native-setup.exe
            artifacts/SOCDOF-*-windows-x64-native-portable.zip
          if-no-files-found: error
          retention-days: 30
