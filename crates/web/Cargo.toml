[package]
name = "socdof-web"
description = "Browser (WebAssembly) host of the SOCDOF Rust interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# The host only exists for the browser. A native build compiles an empty crate, so the desktop
# workspace keeps working without a browser toolchain or X11 development packages.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { workspace = true }
eframe = { workspace = true }
js-sys = { workspace = true }
log = { workspace = true }
socdof-core = { path = "../core" }
socdof-ui = { path = "../ui" }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }
