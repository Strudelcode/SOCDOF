[package]
name = "socdof-core"
description = "Domain model and SQLite persistence for SOCDOF"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
argon2 = { workspace = true }
flate2 = "1"
image = { version = "0.24.9", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
png = { workspace = true }
sha2 = { workspace = true }

# The browser build has no system clock and needs the JavaScript RNG for password salts, session
# tokens and the UUID primary keys. Both are only pulled in for the wasm target.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# SVG logos need a small pure-Rust rasterizer. The browser build keeps its existing decoders.
resvg = "0.45.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }
