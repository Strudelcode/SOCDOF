[package]
name = "socdof-desktop"
description = "SOCDOF Tauri desktop window"
version = "0.21.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "socdof_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-dialog = { version = "2", features = ["blocking"] }
socdof-app = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# Desktop crate is its own workspace because Tauri needs GTK/WebKit development packages.
# The root workspace and its fmt/clippy/test jobs stay independent of those system libraries.
[workspace]
