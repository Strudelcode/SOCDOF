[package]
name = "socdof-desktop"
description = "SOCDOF Tauri desktop window"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "socdof_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
socdof-app = { path = ".." }

# Desktop crate is its own workspace because Tauri needs GTK/WebKit development packages.
# The root workspace and its fmt/clippy/test jobs stay independent of those system libraries.
[workspace]
