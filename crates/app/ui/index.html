<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOCDOF</title>
  </head>
  <body>
    <div class="desktop-icons" aria-label="Desktop-Verknüpfungen">
      <button type="button" class="desktop-shortcut" data-desktop-view="dashboard" style="--tile:#9333ea" title="Dashboard">◈</button>
      <button type="button" class="desktop-shortcut" data-desktop-view="invoices" style="--tile:#ea580c" title="Rechnungen">▤</button>
      <button type="button" class="desktop-shortcut" data-desktop-view="accounting" style="--tile:#4f46e5" title="Abrechnung">€</button>
      <button type="button" class="desktop-shortcut" data-desktop-view="contacts" style="--tile:#2563eb" title="Kontakte">♧</button>
      <button type="button" class="desktop-shortcut" data-desktop-view="products" style="--tile:#059669" title="Produkte">▣</button>
      <button type="button" class="desktop-shortcut" data-desktop-view="calendar" style="--tile:#be185d" title="Kalender">▦</button>
      <button type="button" class="desktop-shortcut" data-desktop-view="purchases" style="--tile:#0d9488" title="Einkauf">▥</button>
      <button type="button" class="desktop-shortcut" data-desktop-view="reports" style="--tile:#2563eb" title="Berichte">▥</button>
      <button type="button" class="desktop-shortcut" data-desktop-view="projects" style="--tile:#4f46e5" title="Projekte">▣</button>
      <button type="button" class="desktop-shortcut" data-desktop-view="documents" style="--tile:#334155" title="Dokumente">▤</button>
      <button type="button" class="desktop-shortcut" data-desktop-view="settings" style="--tile:#d97706" title="Einstellungen">⚙</button>
      <button type="button" class="desktop-shortcut" data-desktop-view="templates" style="--tile:#ea580c" title="Vorlagen">▧</button>
    </div>
    <div class="app">
      <header class="app-header">
        <div class="window-heading">
          <p class="brand">SOCDOF</p>
          <h1 id="app-title" data-i18n="screenTitle"></h1>
          <span id="app-tag" class="window-tag"></span>
          <p id="app-subtitle" class="subtitle" data-i18n="screenSubtitle"></p>
        </div>
        <div class="header-actions">
          <span class="badge" data-i18n="sessionBadge"></span>
          <div class="header-tools" role="group">
            <button id="command-open" class="header-tool" type="button" title="Befehl">⌘</button>
            <button id="taskview-open" class="header-tool" type="button" title="Aufgabenansicht">▤</button>
            <button id="widgets-open" class="header-tool" type="button" title="Widgets">✦</button>
            <button id="calculator-open" class="header-tool" type="button" title="Taschenrechner">▦</button>
            <span class="window-separator" aria-hidden="true"></span>
            <button id="window-toggle-fullscreen" class="window-control" type="button" title="Vollbild">⛶</button>
            <button id="window-minimize" class="window-control" type="button" title="Minimieren">−</button>
            <button id="window-toggle-maximize" class="window-control" type="button" title="Maximieren">□</button>
            <button id="window-close" class="window-control window-control-close" type="button" title="Schließen">×</button>
          </div>
        </div>
      </header>

      <nav class="tabs" aria-label="SOCDOF">
        <button class="tab tab-with-icon is-active" type="button" data-view="dashboard"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg></span><span data-i18n="navDashboard"></span></button>
        <button class="tab tab-with-icon" type="button" data-view="invoices"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg></span><span data-i18n="navInvoices"></span></button>
        <button class="tab tab-with-icon" type="button" data-view="accounting"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg></span><span data-i18n="navAccounting"></span></button>
        <button class="tab tab-with-icon" type="button" data-view="contacts"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg></span><span data-i18n="navContacts"></span></button>
        <button class="tab tab-with-icon" type="button" data-view="products"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/></svg></span><span data-i18n="navProducts"></span></button>
        <button class="tab tab-with-icon" type="button" data-view="stock"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></svg></span><span>Lager</span></button>
        <button class="tab" type="button" data-view="templates" data-i18n="navTemplates"></button>
        <button class="tab" type="button" data-view="purchases" data-i18n="navPurchases"></button>
        <button class="tab" type="button" data-view="reports" data-i18n="navReports"></button>
        <button class="tab" type="button" data-view="fleet" data-i18n="navFleet"></button>
        <button class="tab" type="button" data-view="projects" data-i18n="navProjects"></button>
        <button class="tab" type="button" data-view="restaurant" data-i18n="navRestaurant"></button>
        <button class="tab" type="button" data-view="documents" data-i18n="navDocuments"></button>
        <button class="tab" type="button" data-view="docs" data-i18n="navDocs"></button>
        <button class="tab" type="button" data-view="users" data-i18n="navUsers"></button>
        <button class="tab" type="button" data-view="settings" data-i18n="navSettings"></button>
        <button class="tab" type="button" data-view="calendar" data-i18n="navCalendar" aria-hidden="true" style="display:none"></button>
      </nav>

      <main class="workspace-window-body">
        <section id="view-dashboard" class="view">
          <div id="dashboard-overview"></div>
          <div class="grid">
            <section class="card" aria-labelledby="status-title">
              <h2 id="status-title" data-i18n="statusTitle"></h2>
              <p class="message" id="status-message" data-i18n="loading" role="status"></p>
              <dl class="facts">
                <div class="fact">
                  <dt data-i18n="database"></dt>
                  <dd id="database">…</dd>
                </div>
                <div class="fact">
                  <dt data-i18n="schemaVersion"></dt>
                  <dd id="schema-version">…</dd>
                </div>
                <div class="fact">
                  <dt data-i18n="contacts"></dt>
                  <dd id="contacts">…</dd>
                </div>
                <div class="fact">
                  <dt data-i18n="products"></dt>
                  <dd id="products">…</dd>
                </div>
                <div class="fact">
                  <dt data-i18n="invoices"></dt>
                  <dd id="invoices">…</dd>
                </div>
                <div class="fact">
                  <dt data-i18n="users"></dt>
                  <dd id="users">…</dd>
                </div>
                <div class="fact">
                  <dt data-i18n="lockOwner"></dt>
                  <dd id="lock-owner">…</dd>
                </div>
              </dl>
            </section>

            <section class="card" aria-labelledby="backup-title">
              <h2 id="backup-title" data-i18n="backupTitle"></h2>
              <p class="hint" data-i18n="backupHint"></p>
              <button id="backup-button" type="button" data-i18n="backupAction"></button>
              <p class="message" id="backup-result" role="status"></p>
            </section>

            <section id="update-card" class="card update-card" aria-labelledby="update-title">
              <div>
                <h2 id="update-title" data-i18n="updateTitle"></h2>
                <p class="hint" data-i18n="updateHint"></p>
              </div>
              <button id="update-button" type="button" data-i18n="updateAction"></button>
              <p class="message" id="update-result" role="status"></p>
            </section>
          </div>
        </section>

        <section id="view-contacts" class="view" hidden>
          <div class="page-card contacts-top">
            <div class="page-identity contacts-identity">
              <span class="contacts-badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
              <div>
                <h2 data-i18n="contactsTitle"></h2>
                <p class="subtitle" id="contacts-count"></p>
              </div>
            </div>
            <div class="contacts-actions">
              <button id="contact-new" class="contacts-new" type="button"><span aria-hidden="true">+</span> <span id="contacts-new-label" data-i18n="contactsNew"></span></button>
              <button id="contact-batch" class="contacts-secondary" type="button"><span aria-hidden="true">▤</span> <span id="contact-batch-label">+ Mehrere anlegen</span></button>
              <label class="contacts-secondary contacts-import">
                <span aria-hidden="true">⇧</span> <span id="contact-import-label">CSV / Outlook Import</span>
                <input id="contact-import-file" type="file" accept=".csv,.vcf,.vcard,text/csv" hidden />
              </label>
              <div class="contacts-export-wrap">
                <button id="contact-export" class="contacts-secondary" type="button"><span aria-hidden="true">⇩</span> <span id="contact-export-label">Export</span> <span class="chevron" aria-hidden="true">▾</span></button>
                <div id="contact-export-menu" class="contacts-export-menu" hidden>
                  <p id="contact-export-options-label">Kontakte exportieren</p>
                  <button type="button" id="contact-export-csv"><span class="export-icon csv">▦</span><span><strong>CSV / Excel (<span id="contact-export-count">0</span>)</strong><small id="contact-export-all-label">Alle Kontakte exportieren</small></span></button>
                  <button type="button" id="contact-export-vcf"><span class="export-icon vcf">◎</span><span><strong>vCard (.vcf) (<span id="contact-export-vcf-count">0</span>)</strong><small id="contact-export-vcf-label">Outlook, Apple &amp; Android</small></span></button>
                </div>
              </div>
            </div>
          </div>
          <div class="filter-row contacts-filter-row">
            <div class="filter-pills contact-filters" role="tablist" aria-label="Kontaktfilter">
              <button type="button" class="filter-pill is-active" role="tab" aria-selected="true" data-contact-filter="all"><span data-i18n="invoicesFilterAll"></span> (<span id="contacts-count-all">0</span>)</button>
              <button type="button" class="filter-pill" role="tab" aria-selected="false" data-contact-filter="customer"><span data-i18n="contactsFilterCustomers"></span> (<span id="contacts-count-customer">0</span>)</button>
              <button type="button" class="filter-pill contact-guest-filter" role="tab" aria-selected="false" data-contact-filter="guest"><span class="guest-book-icon" aria-hidden="true">▤</span><span data-i18n="contactsFilterGuests"></span> <span class="guest-count" id="contacts-count-guest">0</span></button>
              <button type="button" class="filter-pill" role="tab" aria-selected="false" data-contact-filter="vendor"><span data-i18n="contactsFilterVendors"></span> (<span id="contacts-count-vendor">0</span>)</button>
            </div>
            <label class="search-field contact-search-field">
              <span class="visually-hidden" data-i18n="contactsSearchLabel"></span>
              <input id="contact-search" type="search" autocomplete="off" />
            </label>
          </div>
          <p id="contacts-message" class="message" role="status"></p>
          <div id="contacts-list" class="entity-list contacts-grid"></div>
        </section>

        <section id="view-products" class="view" hidden>
          <div class="section-head">
            <div>
              <p class="eyebrow" data-i18n="masterDataLabel"></p>
              <h2 data-i18n="productsTitle"></h2>
              <p class="subtitle" id="products-count"></p>
            </div>
            <div class="toolbar">
              <label class="search-field">
                <span class="visually-hidden" data-i18n="productsSearchLabel"></span>
                <input id="product-search" type="search" autocomplete="off" />
              </label>
              <button id="product-new" type="button" data-i18n="productsNew"></button>
            </div>
          </div>
          <p id="products-message" class="message" role="status"></p>
          <div id="products-list" class="entity-list"></div>
        </section>

        <section id="view-invoices" class="view" hidden>
          <div class="page-card invoice-banner" id="invoice-incomplete-banner">
            <span class="banner-icon" aria-hidden="true">!</span>
            <div class="banner-copy">
              <strong data-i18n="invoicesIncompleteTitle"></strong>
              <p data-i18n="invoicesIncompleteHint"></p>
            </div>
            <button type="button" id="invoice-complete-data" data-i18n="invoicesIncompleteAction"></button>
          </div>
          <div class="filter-row invoice-toolbar-row">
            <div class="filter-pills invoice-filters" role="tablist" aria-label="Rechnungsfilter">
              <button type="button" class="filter-pill is-active" role="tab" aria-selected="true" data-invoice-filter="all"><span data-i18n="invoicesFilterAll"></span><span class="invoice-filter-count">(<span id="invoice-count-all">0</span>)</span></button>
              <button type="button" class="filter-pill" role="tab" aria-selected="false" data-invoice-filter="draft"><span data-i18n="invoiceStatusDraft"></span><span class="invoice-filter-count">(<span id="invoice-count-draft">0</span>)</span></button>
              <button type="button" class="filter-pill" role="tab" aria-selected="false" data-invoice-filter="sent"><span data-i18n="invoiceStatusSent"></span><span class="invoice-filter-count">(<span id="invoice-count-sent">0</span>)</span></button>
              <button type="button" class="filter-pill" role="tab" aria-selected="false" data-invoice-filter="paid"><span data-i18n="invoiceStatusPaid"></span><span class="invoice-filter-count">(<span id="invoice-count-paid">0</span>)</span></button>
            </div>
            <div class="invoice-toolbar-actions">
              <label class="search-field invoice-search-field">
                <span class="visually-hidden" data-i18n="invoicesSearchLabel"></span>
                <input id="invoice-search" type="search" autocomplete="off" />
              </label>
              <select id="invoice-status-filter" class="visually-hidden" tabindex="-1" aria-hidden="true"></select>
              <button id="invoice-templates" class="invoice-tool-button" type="button"><span aria-hidden="true">▤</span> <span id="invoice-templates-label">Vorlagen &amp; Layout</span></button>
              <label class="invoice-tool-button invoice-import-button">
                <span aria-hidden="true">⇧</span> <span id="invoice-import-label">XML / FatturaPA importieren</span>
                <input id="invoice-import-file" type="file" accept=".xml,.p7m" hidden />
              </label>
              <button id="invoice-new" type="button"><span aria-hidden="true">+</span> <span data-i18n="invoicesNew"></span></button>
            </div>
          </div>
          <p id="invoices-message" class="message" role="status"></p>
          <div class="invoice-journal">
            <div class="invoice-journal-head">
              <h2><span id="invoice-journal-label">Rechnungsjournal</span> (<span id="invoices-count">0</span> <span id="invoice-entries-label">Einträge</span>)</h2>
            </div>
            <table class="invoice-table">
              <thead>
                <tr>
                  <th id="invoice-th-number">Rechnungs-Nr.</th>
                  <th id="invoice-th-contact">Kunde / Empfänger</th>
                  <th id="invoice-th-date">Datum</th>
                  <th id="invoice-th-due">Fälligkeit</th>
                  <th id="invoice-th-status">Status</th>
                  <th id="invoice-th-total" class="right">Gesamtbetrag (Brutto)</th>
                  <th id="invoice-th-actions" class="right">Aktionen</th>
                </tr>
              </thead>
              <tbody id="invoices-list"></tbody>
            </table>
          </div>
        </section>

        <section id="view-fleet" class="view" hidden>
          <div class="grid fleet-kpis">
            <section class="card">
              <h3 data-i18n="fleetKpiTotal"></h3>
              <p id="fleet-kpi-total" class="fleet-kpi-value">–</p>
            </section>
            <section class="card">
              <h3 data-i18n="fleetKpiBusiness"></h3>
              <p id="fleet-kpi-business" class="fleet-kpi-value">–</p>
            </section>
            <section class="card">
              <h3 data-i18n="fleetKpiFuel"></h3>
              <p id="fleet-kpi-fuel" class="fleet-kpi-value">–</p>
            </section>
            <section class="card">
              <h3 data-i18n="fleetKpiVehicles"></h3>
              <p id="fleet-kpi-vehicles" class="fleet-kpi-value">–</p>
            </section>
          </div>

          <section class="card">
            <div class="toolbar fleet-toolbar">
              <div class="fleet-tabs">
                <button class="secondary" id="fleet-tab-logbook" type="button" data-i18n="fleetTabLogbook"></button>
                <button class="secondary" id="fleet-tab-vehicles" type="button" data-i18n="fleetTabVehicles"></button>
                <button class="secondary" id="fleet-tab-fuel" type="button" data-i18n="fleetTabFuel"></button>
              </div>
              <input id="fleet-search" type="search">
              <select id="fleet-vehicle-filter">
                <option value="all" data-i18n="fleetFilterVehicleAll"></option>
              </select>
              <select id="fleet-purpose-filter">
                <option value="all" data-i18n="fleetFilterPurposeAll"></option>
                <option value="business" data-i18n="fleetPurposeBusiness"></option>
                <option value="private" data-i18n="fleetPurposePrivate"></option>
                <option value="commute" data-i18n="fleetPurposeCommute"></option>
              </select>
              <input id="fleet-date-from" type="date" aria-label="from">
              <input id="fleet-date-to" type="date" aria-label="to">
              <button id="fleet-add-vehicle" type="button" data-i18n="fleetAddVehicle"></button>
              <button id="fleet-add-trip" type="button" data-i18n="fleetAddTrip"></button>
              <button id="fleet-add-fuel" type="button" data-i18n="fleetAddFuel"></button>
              <button class="secondary" id="fleet-export-csv" type="button" data-i18n="fleetExportCsv"></button>
            </div>
            <p id="fleet-message" class="message" role="status"></p>
            <div id="fleet-logbook"></div>
            <div id="fleet-vehicles" hidden></div>
            <div id="fleet-fuel" hidden></div>
          </section>
        </section>

        <section id="view-projects" class="view" hidden>
          <div class="grid project-kpis">
            <section class="card">
              <h3 data-i18n="projectKpiActive"></h3>
              <p id="project-kpi-active" class="fleet-kpi-value">–</p>
            </section>
            <section class="card">
              <h3 data-i18n="projectKpiProgress"></h3>
              <p id="project-kpi-progress" class="fleet-kpi-value">–</p>
            </section>
            <section class="card">
              <h3 data-i18n="projectKpiHours"></h3>
              <p id="project-kpi-hours" class="fleet-kpi-value">–</p>
            </section>
            <section class="card">
              <h3 data-i18n="projectKpiRevenue"></h3>
              <p id="project-kpi-revenue" class="fleet-kpi-value">–</p>
            </section>
          </div>

          <section class="card">
            <div class="toolbar project-toolbar">
              <div class="project-tabs">
                <button id="project-tab-portfolio" type="button" data-i18n="projectTabPortfolio"></button>
                <button id="project-tab-kanban" type="button" data-i18n="projectTabKanban"></button>
              </div>
              <input id="project-search" type="search">
              <select id="project-status-filter">
                <option value="all" data-i18n="projectFilterStatusAll"></option>
                <option value="active" data-i18n="projectStatusActive"></option>
                <option value="planning" data-i18n="projectStatusPlanning"></option>
                <option value="review" data-i18n="projectStatusReview"></option>
                <option value="completed" data-i18n="projectStatusCompleted"></option>
                <option value="on_hold" data-i18n="projectStatusOnHold"></option>
              </select>
              <select id="project-category-filter">
                <option value="all" data-i18n="projectFilterCategoryAll"></option>
                <option value="client_work" data-i18n="projectCategoryClient"></option>
                <option value="internal" data-i18n="projectCategoryInternal"></option>
                <option value="maintenance" data-i18n="projectCategoryMaintenance"></option>
                <option value="development" data-i18n="projectCategoryDevelopment"></option>
                <option value="marketing" data-i18n="projectCategoryMarketing"></option>
              </select>
              <button id="project-new" type="button" data-i18n="projectNew"></button>
              <button class="secondary" id="project-export-csv" type="button" data-i18n="projectExportCsv"></button>
            </div>
            <p id="project-message" class="message" role="status"></p>
            <div id="project-portfolio"></div>
            <div id="project-kanban" hidden>
              <div class="toolbar project-board-switcher">
                <label class="field field-inline">
                  <span data-i18n="projectCurrent"></span>
                  <select id="project-kanban-select"></select>
                </label>
                <button id="project-add-task" type="button" data-i18n="projectAddTask"></button>
              </div>
              <div id="project-board" class="project-columns"></div>
            </div>
          </section>
        </section>
