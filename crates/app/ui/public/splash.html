<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SOCDOF</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f6f8;
        --fg: #1c2530;
        --muted: #5f6b7a;
        --accent: #2f6f4e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151a20;
          --fg: #e8edf3;
          --muted: #9aa7b6;
          --accent: #6fbf94;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
        height: 100%;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      h1 {
        margin: 0;
        font-size: 1.6rem;
        letter-spacing: 0.18em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .bar {
        width: 12rem;
        height: 3px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--muted) 25%, transparent);
        overflow: hidden;
      }
      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: var(--accent);
        animation: slide 1.1s ease-in-out infinite alternate;
      }
      @keyframes slide {
        from {
          transform: translateX(-10%);
        }
        to {
          transform: translateX(160%);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SOCDOF</h1>
      <div class="bar" role="progressbar" aria-label="Starting"></div>
      <p>Preparing database and session …</p>
    </main>
  </body>
</html>
