<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOCDOF Desktop</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      background: #070A14;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-app-region: drag;
    }
    .card {
      width: 320px;
      height: 380px;
      background: linear-gradient(145deg, #0B0F1E 0%, #11162B 50%, #0A0D18 100%);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      position: relative;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8),
                  0 0 35px 0 rgba(79, 70, 229, 0.15);
      overflow: hidden;
    }
    /* Ambient glow behind logo */
    .glow-sphere {
      position: absolute;
      top: 70px;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, rgba(139, 92, 246, 0.1) 60%, transparent 80%);
      border-radius: 50%;
      pointer-events: none;
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 1; }
    }
    .logo-container {
      position: relative;
      width: 88px;
      height: 88px;
      border-radius: 24px;
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px -4px rgba(79, 70, 229, 0.5);
      margin-bottom: 22px;
      z-index: 2;
      animation: floatLogo 3s ease-in-out infinite alternate;
    }
    @keyframes floatLogo {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-4px); }
    }
    .logo-container img {
      width: 84px;
      height: 84px;
      border-radius: 22px;
      object-fit: cover;
    }
    .title {
      font-size: 22px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      z-index: 2;
    }
    .badge {
      display: inline-block;
      font-size: 9.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #A5B4FC;
      background: rgba(30, 27, 75, 0.7);
      border: 1px solid rgba(67, 56, 202, 0.5);
      padding: 3px 10px;
      border-radius: 6px;
      margin-bottom: 30px;
      z-index: 2;
    }
    .status-text {
      font-size: 12.5px;
      font-weight: 600;
      color: #94A3B8;
      margin-bottom: 14px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .progress-bar-container {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      z-index: 2;
    }
    .progress-bar {
      width: 60px;
      height: 100%;
      background: linear-gradient(90deg, #6366F1, #A855F7, #38BDF8);
      border-radius: 999px;
      position: absolute;
      animation: shimmerMove 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes shimmerMove {
      0% { left: -60px; width: 40px; }
      50% { width: 90px; }
      100% { left: 200px; width: 40px; }
    }
    .footer-note {
      position: absolute;
      bottom: 16px;
      font-size: 9px;
      font-weight: 500;
      color: #475569;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="glow-sphere"></div>
    <div class="logo-container">
      <img src="../public/socdof_icon.png" alt="SOCDOF Logo">
    </div>
    <h1 class="title">SOCDOF</h1>
    <div class="badge">Desktop Suite</div>

    <div class="status-text" id="status-label">
      Wird gestartet...
    </div>

    <div class="progress-bar-container">
      <div class="progress-bar"></div>
    </div>

    <div class="footer-note">
      100% Offline • Strudelcode
    </div>
  </div>

  <script>
    // Detect system language and set localized loading status
    try {
      const lang = (navigator.language || '').toLowerCase();
      const labelEl = document.getElementById('status-label');
      if (labelEl) {
        if (lang.startsWith('en')) {
          labelEl.textContent = 'Starting...';
        } else if (lang.startsWith('fr')) {
          labelEl.textContent = 'Démarrage...';
        } else if (lang.startsWith('es')) {
          labelEl.textContent = 'Iniciando...';
        } else {
          labelEl.textContent = 'Wird gestartet...';
        }
      }
    } catch (_) {}
  </script>
</body>
</html>
