<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOCDOF</title>
<style>
:root {
  color-scheme: dark;
  font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #202225;
  color: #f2f3f5;
  user-select: none;
  -webkit-user-select: none;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 20px;
  background: #202225;
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
  -webkit-app-region: drag;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}
.logo-container {
  width: 84px;
  height: 84px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
}
.logo {
  width: 84px;
  height: 84px;
  object-fit: contain;
  filter: drop-shadow(0 8px 20px rgba(88, 101, 242, 0.3));
  animation: breathe 2.8s ease-in-out infinite;
}
.app-title {
  font-size: 20px;
  font-weight: 800;
  color: #f2f3f5;
  letter-spacing: 0.04em;
  margin-bottom: 6px;
}
.app-badge {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #8590f7;
  background: #2b2d31;
  padding: 3px 10px;
  border-radius: 6px;
  margin-bottom: 22px;
}
.status-text {
  font-size: 13px;
  font-weight: 500;
  color: #dbdee1;
  letter-spacing: 0.015em;
  margin-bottom: 14px;
  text-align: center;
}
.track {
  height: 4px;
  width: 180px;
  border-radius: 99px;
  background: #35373c;
  overflow: hidden;
  position: relative;
}
.bar {
  height: 100%;
  width: 45%;
  border-radius: 99px;
  background: #5865f2;
  animation: travel 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}
.footer-text {
  position: absolute;
  bottom: 16px;
  font-size: 9.5px;
  color: #72767d;
  letter-spacing: 0.02em;
}
@keyframes travel {
  0% { transform: translateX(-120%); }
  100% { transform: translateX(250%); }
}
@keyframes breathe {
  0%, 100% { transform: scale(1); filter: drop-shadow(0 6px 16px rgba(88, 101, 242, 0.2)); }
  50% { transform: scale(1.04); filter: drop-shadow(0 10px 24px rgba(88, 101, 242, 0.42)); }
}
@media (prefers-reduced-motion: reduce) {
  .logo, .bar { animation: none !important; }
  .bar { width: 60%; }
}
</style>
</head>
<body>
  <div class="logo-container">
    <svg class="logo" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="socdof-bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#252932" />
          <stop offset="100%" stop-color="#14171d" />
        </linearGradient>
      </defs>
      <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#socdof-bg)" />
      <path d="M 24 168 C 24 88 88 24 168 24" stroke="#22c55e" stroke-width="28" stroke-linecap="round" fill="none" />
      <path d="M 344 24 C 424 24 488 88 488 168" stroke="#38bdf8" stroke-width="28" stroke-linecap="round" fill="none" />
      <path d="M 488 344 C 488 424 424 488 344 488" stroke="#ef4444" stroke-width="28" stroke-linecap="round" fill="none" />
      <path d="M 168 488 C 88 488 24 424 24 344" stroke="#f59e0b" stroke-width="28" stroke-linecap="round" fill="none" />
      <rect x="40" y="40" width="432" height="432" rx="96" ry="96" stroke="rgba(255,255,255,0.08)" stroke-width="6" fill="none" />
      <text x="256" y="342" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="268" fill="#ffffff" letter-spacing="-6">S</text>
    </svg>
  </div>
  <div class="app-title">SOCDOF</div>
  <div class="app-badge">DESKTOP SUITE</div>
  <div class="status-text" id="status-text">Wird gestartet...</div>
  <div class="track">
    <div class="bar"></div>
  </div>
  <div class="footer-text">100% Offline • Strudelcode</div>

  <script>
    (async () => {
      const messages = {
        de: 'Wird gestartet...',
        en: 'Starting...',
        fr: 'Démarrage...',
        es: 'Iniciando...'
      };
      let lang = 'de';
      try {
        const stored = localStorage.getItem('socdof_language');
        if (stored && messages[stored]) {
          lang = stored;
        } else if (navigator.language) {
          const navLang = navigator.language.slice(0, 2).toLowerCase();
          if (messages[navLang]) lang = navLang;
        }
      } catch (_) {}
      const label = document.getElementById('status-text');
      if (label && messages[lang]) {
        label.textContent = messages[lang];
      }
    })();
  </script>
</body>
</html>
