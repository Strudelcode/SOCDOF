<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOCDOF</title>
<style>
:root {
  color-scheme: dark;
  font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #202225;
  color: #f2f3f5;
  user-select: none;
  -webkit-user-select: none;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #202225;
}
body {
  border-radius: 20px;
  background: linear-gradient(180deg, #262930 0%, #17181c 100%);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
  -webkit-app-region: drag;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}
.logo-container {
  width: 100px;
  height: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
  position: relative;
}
.logo-ambient {
  position: absolute;
  width: 120px;
  height: 120px;
  background: radial-gradient(circle, rgba(88, 101, 242, 0.32) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}
.logo {
  width: 86px;
  height: 86px;
  object-fit: contain;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.65);
  animation: breathe 3s ease-in-out infinite;
  position: relative;
  z-index: 2;
}
.app-title {
  font-size: 22px;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: 0.04em;
  margin-bottom: 4px;
  z-index: 2;
}
.app-subtitle {
  font-size: 8.5px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #8e9aff;
  margin-bottom: 24px;
  z-index: 2;
}
.status-text {
  font-size: 13px;
  font-weight: 600;
  color: #dbdee1;
  letter-spacing: 0.015em;
  margin-bottom: 14px;
  text-align: center;
  z-index: 2;
}
.track {
  height: 6px;
  width: 200px;
  border-radius: 99px;
  background: #2b2d31;
  border: 1px solid rgba(255, 255, 255, 0.08);
  overflow: hidden;
  position: relative;
  z-index: 2;
}
.bar {
  height: 100%;
  width: 45%;
  border-radius: 99px;
  background: linear-gradient(90deg, #5865f2, #808cff);
  box-shadow: 0 0 10px rgba(88, 101, 242, 0.5);
  animation: travel 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}
.percent-text {
  font-size: 10px;
  color: #8e9aff;
  margin-top: 8px;
  z-index: 2;
}
.footer-text {
  position: absolute;
  bottom: 16px;
  font-size: 9px;
  color: #72767d;
  letter-spacing: 0.03em;
}
@keyframes travel {
  0% { transform: translateX(-120%); }
  100% { transform: translateX(250%); }
}
@keyframes breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.025); }
}
@media (prefers-reduced-motion: reduce) {
  .logo, .bar { animation: none !important; }
  .bar { width: 60%; }
}
</style>
</head>
<body>
  <div class="logo-container">
    <div class="logo-ambient"></div>
    <img class="logo" src="../public/socdof_icon.png" alt="SOCDOF Logo" onerror="this.onerror=null; this.src='../dist/socdof_icon.png';" />
  </div>
  <div class="app-title">SOCDOF</div>
  <div class="app-subtitle">OFFLINE COMMERCE & ERP SUITE</div>
  <div class="status-text" id="status-text">Wird gestartet...</div>
  <div class="track">
    <div class="bar" id="progress-bar"></div>
  </div>
  <div class="percent-text" id="percent-text"></div>
  <div class="footer-text">Strudelcode · 100% Offline Desktop Suite</div>

  <script>
    (() => {
      // Localized labels for the first-run data preparation steps (de, en, fr, es)
      const messages = {
        de: { start: 'Daten werden vorbereitet...', folders: 'Datenordner wird erstellt...', languages: 'Sprachdateien werden geladen...', watchers: 'Ordner werden überwacht...', finishing: 'Fast fertig...', ready: 'Fertig' },
        en: { start: 'Preparing data...', folders: 'Creating data folders...', languages: 'Loading language files...', watchers: 'Setting up folder watchers...', finishing: 'Almost done...', ready: 'Done' },
        fr: { start: 'Préparation des données...', folders: 'Création des dossiers de données...', languages: 'Chargement des fichiers de langue...', watchers: 'Surveillance des dossiers...', finishing: 'Presque terminé...', ready: 'Terminé' },
        es: { start: 'Preparando los datos...', folders: 'Creando las carpetas de datos...', languages: 'Cargando los archivos de idioma...', watchers: 'Configurando la supervisión de carpetas...', finishing: 'Casi listo...', ready: 'Listo' }
      };
      let lang = 'de';
      try {
        const stored = localStorage.getItem('socdof_language');
        if (stored && messages[stored]) {
          lang = stored;
        } else if (navigator.language) {
          const navLang = navigator.language.slice(0, 2).toLowerCase();
          if (messages[navLang]) lang = navLang;
        }
      } catch (_) {}
      const dict = messages[lang];
      const label = document.getElementById('status-text');
      const bar = document.getElementById('progress-bar');
      const percentText = document.getElementById('percent-text');
      if (label) label.textContent = dict.start;
      if (bar) bar.style.width = '5%';

      // Progress is pushed from the main process; the bar switches from indeterminate to determinate
      if (window.electronAPI && window.electronAPI.onSplashProgress) {
        window.electronAPI.onSplashProgress(({ percent, stepKey }) => {
          if (label && dict[stepKey]) label.textContent = dict[stepKey];
          if (bar) {
            bar.style.animation = 'none';
            bar.style.width = Math.max(0, Math.min(100, percent)) + '%';
          }
          if (percentText) percentText.textContent = Math.round(percent) + '%';
        });
      }
    })();
  </script>
</body>
</html>
