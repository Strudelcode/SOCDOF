<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOCDOF</title>
<style>
:root {
  color-scheme: dark;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #202225;
  color: #f2f3f5;
  user-select: none;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 18px;
  background: #202225;
  -webkit-app-region: drag;
}
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}
.logo-container {
  width: 80px;
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 24px;
}
.logo {
  width: 80px;
  height: 80px;
  object-fit: contain;
  filter: drop-shadow(0 6px 18px rgba(88, 101, 242, 0.25));
  animation: breathe 2.6s ease-in-out infinite;
}
.status-text {
  font-size: 14px;
  font-weight: 500;
  color: #f2f3f5;
  letter-spacing: 0.015em;
  margin-bottom: 18px;
  text-align: center;
}
.track {
  height: 3px;
  width: 140px;
  border-radius: 99px;
  background: #35373c;
  overflow: hidden;
  position: relative;
}
.bar {
  height: 100%;
  width: 45%;
  border-radius: 99px;
  background: #5865f2;
  animation: travel 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}
@keyframes travel {
  0% { transform: translateX(-120%); }
  100% { transform: translateX(250%); }
}
@keyframes breathe {
  0%, 100% { transform: scale(1); filter: drop-shadow(0 6px 16px rgba(88, 101, 242, 0.2)); }
  50% { transform: scale(1.04); filter: drop-shadow(0 8px 24px rgba(88, 101, 242, 0.38)); }
}
@media (prefers-reduced-motion: reduce) {
  .logo, .bar { animation: none !important; }
  .bar { width: 60%; }
}
</style>
</head>
<body>
  <div class="logo-container">
    <img class="logo" src="../public/socdof_icon.png" alt="SOCDOF" />
  </div>
  <div class="status-text" id="status-text">Starting...</div>
  <div class="track">
    <div class="bar"></div>
  </div>

  <script>
    (async () => {
      const messages = {
        de: 'Wird gestartet...',
        en: 'Starting...',
        fr: 'Démarrage...',
        es: 'Iniciando...'
      };
      let lang = 'de';
      try {
        const stored = localStorage.getItem('socdof_language');
        if (stored && messages[stored]) {
          lang = stored;
        } else if (navigator.language) {
          const navLang = navigator.language.slice(0, 2).toLowerCase();
          if (messages[navLang]) lang = navLang;
        }
      } catch (_) {}
      const label = document.getElementById('status-text');
      if (label && messages[lang]) {
        label.textContent = messages[lang];
      }
    })();
  </script>
</body>
</html>
