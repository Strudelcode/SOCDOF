[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/ui", "crates/cli"]
# The Tauri crate is its own workspace: it needs GTK/WebKit development packages that the core
# workspace must not require. CI builds it in the dedicated desktop job.
exclude = ["crates/app/src-tauri"]

[workspace.package]
version = "0.21.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
# egui 0.27 is the newest release that keeps the workspace MSRV of 1.75.
egui = "0.27.2"
eframe = "0.27.2"
# Lossless PNG decoding for the bundled desktop wallpapers.
png = "0.17"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
