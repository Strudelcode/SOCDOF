<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SOCDOF</title>
    <meta name="description" content="SOCDOF - Strudel's Organization, Commerce & Documentation Offline Flow. 100% lokale Windows Desktop ERP Suite mit Fenstermanager, DIN 5008, CRM, POS Kasse, Lager, BWA und Buchhaltung." />
    <link rel="icon" type="image/svg+xml" href="socdof_icon.svg" />
    <link rel="icon" type="image/svg+xml" href="./socdof_icon.svg" />
    <link rel="shortcut icon" type="image/svg+xml" href="socdof_icon.svg" />
    <link rel="apple-touch-icon" href="socdof_icon.svg" />
    <link rel="manifest" href="manifest.json">
    <meta name="application-name" content="SOCDOF">
    <meta name="msapplication-TileColor" content="#4f46e5">
    <meta name="theme-color" content="#4f46e5">
    <script>
      try {
        var fs = localStorage.getItem('socdof_font_scale');
        if (fs) document.documentElement.style.fontSize = fs + '%';
        var isDark = localStorage.getItem('odoo_theme_dark');
        if (isDark === 'true') document.documentElement.classList.add('dark');
        var acc = localStorage.getItem('socdof_accent_color');
        if (acc) {
          var hex = '#4f46e5';
          var raw = acc.toLowerCase();
          if (raw.indexOf('custom_') === 0) hex = '#' + raw.replace('custom_', '');
          else if (raw.indexOf('#') === 0) hex = raw;
          else if (/^[0-9a-f]{3,8}$/.test(raw)) hex = '#' + raw;
          else if (raw === 'indigo') hex = '#4f46e5';
          else if (raw === 'purple') hex = '#714B67';
          else if (raw === 'blue') hex = '#2563eb';
          else if (raw === 'teal') hex = '#0d9488';
          else if (raw === 'emerald') hex = '#059669';
          else if (raw === 'rose') hex = '#e11d48';
          else if (raw === 'amber') hex = '#d97706';
          else if (raw === 'sky') hex = '#0284c7';
          else if (raw === 'violet') hex = '#7c3aed';
          
          var r = parseInt(hex.slice(1, 3), 16) || 79;
          var g = parseInt(hex.slice(3, 5), 16) || 70;
          var b = parseInt(hex.slice(5, 7), 16) || 229;
          var root = document.documentElement;
          root.style.setProperty('--accent', hex);
          root.style.setProperty('--accent-light', 'rgba(' + r + ',' + g + ',' + b + ',0.14)');
          root.style.setProperty('--accent-ring', 'rgba(' + r + ',' + g + ',' + b + ',0.35)');
          root.style.setProperty('--accent-taskbar-bg', 'rgba(' + r + ',' + g + ',' + b + ',0.22)');
          root.style.setProperty('--accent-taskbar-border', 'rgba(' + r + ',' + g + ',' + b + ',0.45)');
          root.style.setProperty('--accent-ambient-glow', 'rgba(' + r + ',' + g + ',' + b + ',0.08)');
          root.style.setProperty('--accent-border-subtle', 'rgba(' + r + ',' + g + ',' + b + ',0.22)');
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .font-mono-num {
        font-family: 'JetBrains Mono', monospace;
        font-feature-settings: "tnum";
      }
      @media print {
        body {
          background-color: white !important;
          color: black !important;
        }
        .no-print {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
        .print-container {
          box-shadow: none !important;
          border: none !important;
          width: 100% !important;
          max-width: 100% !important;
          padding: 0 !important;
          margin: 0 !important;
        }
      }
    </style>
  </head>
  <body class="antialiased selection:bg-indigo-500/20 selection:text-indigo-600 dark:selection:text-indigo-300">
    <div id="root">
      <div id="startup-splash" style="position:fixed;inset:0;background:#070A14;display:flex;align-items:center;justify-content:center;z-index:999999;user-select:none;-webkit-user-select:none;font-family:-apple-system,BlinkMacSystemFont,'Plus Jakarta Sans','Segoe UI',Roboto,sans-serif;">
        <style>
          @keyframes splashPulse {
            0% { transform: scale(0.92); opacity: 0.55; }
            100% { transform: scale(1.12); opacity: 0.95; }
          }
          @keyframes splashFloat {
            0% { transform: translateY(0); }
            100% { transform: translateY(-4px); }
          }
          @keyframes splashShimmer {
            0% { left: -60px; width: 40px; }
            50% { width: 90px; }
            100% { left: 220px; width: 40px; }
          }
        </style>
        <div style="width:320px;height:380px;background:linear-gradient(145deg,#0B0F1E 0%,#11162B 50%,#0A0D18 100%);border:1px solid rgba(99,102,241,0.25);border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;position:relative;box-shadow:0 25px 60px -15px rgba(0,0,0,0.8),0 0 35px 0 rgba(79,70,229,0.15);overflow:hidden;">
          <!-- Ambient glow circle -->
          <div style="position:absolute;top:60px;width:140px;height:140px;background:radial-gradient(circle,rgba(99,102,241,0.35) 0%,rgba(139,92,246,0.1) 60%,transparent 80%);border-radius:50%;pointer-events:none;animation:splashPulse 2.8s ease-in-out infinite alternate;"></div>
          
          <!-- Logo container -->
          <div style="position:relative;width:88px;height:88px;border-radius:24px;background:linear-gradient(135deg,#4F46E5 0%,#7C3AED 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 28px -4px rgba(79,70,229,0.5);margin-bottom:22px;z-index:2;animation:splashFloat 3s ease-in-out infinite alternate;">
            <img src="socdof_icon.png" alt="SOCDOF Logo" style="width:84px;height:84px;border-radius:22px;object-fit:cover;" onerror="this.style.display='none'" />
          </div>

          <h1 style="font-size:22px;font-weight:800;color:#FFFFFF;letter-spacing:1.5px;margin:0 0 6px 0;z-index:2;">SOCDOF</h1>
          <div style="display:inline-block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:#A5B4FC;background:rgba(30,27,75,0.7);border:1px solid rgba(67,56,202,0.5);padding:3px 10px;border-radius:6px;margin-bottom:28px;z-index:2;">Desktop Suite</div>

          <div id="startup-status-text" style="font-size:12.5px;font-weight:600;color:#94A3B8;margin-bottom:14px;z-index:2;">
            Wird gestartet...
          </div>

          <!-- Progress Shimmer Bar -->
          <div style="width:200px;height:4px;background:rgba(255,255,255,0.08);border-radius:999px;overflow:hidden;position:relative;z-index:2;">
            <div style="height:100%;background:linear-gradient(90deg,#6366F1,#A855F7,#38BDF8);border-radius:999px;position:absolute;animation:splashShimmer 1.6s cubic-bezier(0.4,0,0.2,1) infinite;"></div>
          </div>

          <div style="position:absolute;bottom:16px;font-size:9px;font-weight:500;color:#475569;letter-spacing:0.5px;">
            100% Offline • Strudelcode
          </div>
        </div>
        <script>
          try {
            var lang = (navigator.language || '').toLowerCase();
            var el = document.getElementById('startup-status-text');
            if (el) {
              if (lang.indexOf('en') === 0) el.textContent = 'Starting...';
              else if (lang.indexOf('fr') === 0) el.textContent = 'Démarrage...';
              else if (lang.indexOf('es') === 0) el.textContent = 'Iniciando...';
            }
          } catch (_) {}
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
