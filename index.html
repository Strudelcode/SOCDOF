<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SOCDOF</title>
    <meta name="description" content="SOCDOF - Strudel's Organization, Commerce & Documentation Offline Flow. 100% lokale Windows Desktop ERP Suite mit Fenstermanager, DIN 5008, CRM, POS Kasse, Lager, BWA und Buchhaltung." />
    <link rel="icon" type="image/svg+xml" href="socdof_icon.svg" />
    <link rel="icon" type="image/svg+xml" href="./socdof_icon.svg" />
    <link rel="shortcut icon" type="image/svg+xml" href="socdof_icon.svg" />
    <link rel="apple-touch-icon" href="socdof_icon.svg" />
    <link rel="manifest" href="manifest.json">
    <meta name="application-name" content="SOCDOF">
    <meta name="msapplication-TileColor" content="#4f46e5">
    <meta name="theme-color" content="#4f46e5">
    <script>
      try {
        var fs = localStorage.getItem('socdof_font_scale');
        if (fs) document.documentElement.style.fontSize = fs + '%';
        var isDark = localStorage.getItem('odoo_theme_dark');
        if (isDark === 'true') document.documentElement.classList.add('dark');
        var acc = localStorage.getItem('socdof_accent_color');
        if (acc) {
          var hex = '#4f46e5';
          var raw = acc.toLowerCase();
          if (raw.indexOf('custom_') === 0) hex = '#' + raw.replace('custom_', '');
          else if (raw.indexOf('#') === 0) hex = raw;
          else if (/^[0-9a-f]{3,8}$/.test(raw)) hex = '#' + raw;
          else if (raw === 'indigo') hex = '#4f46e5';
          else if (raw === 'purple') hex = '#714B67';
          else if (raw === 'blue') hex = '#2563eb';
          else if (raw === 'teal') hex = '#0d9488';
          else if (raw === 'emerald') hex = '#059669';
          else if (raw === 'rose') hex = '#e11d48';
          else if (raw === 'amber') hex = '#d97706';
          else if (raw === 'sky') hex = '#0284c7';
          else if (raw === 'violet') hex = '#7c3aed';
          
          var r = parseInt(hex.slice(1, 3), 16) || 79;
          var g = parseInt(hex.slice(3, 5), 16) || 70;
          var b = parseInt(hex.slice(5, 7), 16) || 229;
          var root = document.documentElement;
          root.style.setProperty('--accent', hex);
          root.style.setProperty('--accent-light', 'rgba(' + r + ',' + g + ',' + b + ',0.14)');
          root.style.setProperty('--accent-ring', 'rgba(' + r + ',' + g + ',' + b + ',0.35)');
          root.style.setProperty('--accent-taskbar-bg', 'rgba(' + r + ',' + g + ',' + b + ',0.22)');
          root.style.setProperty('--accent-taskbar-border', 'rgba(' + r + ',' + g + ',' + b + ',0.45)');
          root.style.setProperty('--accent-ambient-glow', 'rgba(' + r + ',' + g + ',' + b + ',0.08)');
          root.style.setProperty('--accent-border-subtle', 'rgba(' + r + ',' + g + ',' + b + ',0.22)');
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    </noscript>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .font-mono-num {
        font-family: 'JetBrains Mono', monospace;
        font-feature-settings: "tnum";
      }
      @media print {
        body {
          background-color: white !important;
          color: black !important;
        }
        .no-print {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
        .print-container {
          box-shadow: none !important;
          border: none !important;
          width: 100% !important;
          max-width: 100% !important;
          padding: 0 !important;
          margin: 0 !important;
        }
      }
    </style>
  </head>
  <body class="antialiased selection:bg-indigo-500/20 selection:text-indigo-600 dark:selection:text-indigo-300">
    <div id="root">
      <div id="startup-splash" style="position:fixed;inset:0;background:#202225;display:flex;align-items:center;justify-content:center;z-index:999999;user-select:none;-webkit-user-select:none;font-family:-apple-system,BlinkMacSystemFont,'Plus Jakarta Sans','Segoe UI',Roboto,sans-serif;">
        <style>
          @keyframes splashPulse {
            0% { transform: scale(0.94); opacity: 0.6; }
            100% { transform: scale(1.06); opacity: 0.95; }
          }
          @keyframes splashFloat {
            0% { transform: translateY(0); }
            100% { transform: translateY(-3px); }
          }
          @keyframes splashShimmer {
            0% { left: -60px; width: 40px; }
            50% { width: 80px; }
            100% { left: 220px; width: 40px; }
          }
        </style>
        <div style="width:320px;height:380px;background:#2b2d31;border:1px solid rgba(255,255,255,0.06);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;position:relative;box-shadow:0 20px 50px -10px rgba(0,0,0,0.6);overflow:hidden;">
          <!-- Ambient glow circle -->
          <div style="position:absolute;top:60px;width:140px;height:140px;background:radial-gradient(circle,rgba(88,101,242,0.25) 0%,transparent 70%);border-radius:50%;pointer-events:none;animation:splashPulse 2.8s ease-in-out infinite alternate;"></div>
          
          <!-- Logo container -->
          <div style="position:relative;width:84px;height:84px;margin-bottom:18px;z-index:2;animation:splashFloat 3s ease-in-out infinite alternate;">
            <svg style="width:84px;height:84px;filter:drop-shadow(0 6px 16px rgba(88,101,242,0.35));" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="socdof-splash-bg" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#252932" />
                  <stop offset="100%" stop-color="#14171d" />
                </linearGradient>
              </defs>
              <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#socdof-splash-bg)" />
              <path d="M 24 168 C 24 88 88 24 168 24" stroke="#22c55e" stroke-width="28" stroke-linecap="round" fill="none" />
              <path d="M 344 24 C 424 24 488 88 488 168" stroke="#38bdf8" stroke-width="28" stroke-linecap="round" fill="none" />
              <path d="M 488 344 C 488 424 424 488 344 488" stroke="#ef4444" stroke-width="28" stroke-linecap="round" fill="none" />
              <path d="M 168 488 C 88 488 24 424 24 344" stroke="#f59e0b" stroke-width="28" stroke-linecap="round" fill="none" />
              <rect x="40" y="40" width="432" height="432" rx="96" ry="96" stroke="rgba(255,255,255,0.08)" stroke-width="6" fill="none" />
              <text x="256" y="342" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="268" fill="#ffffff" letter-spacing="-6">S</text>
            </svg>
          </div>

          <h1 style="font-size:22px;font-weight:800;color:#FFFFFF;letter-spacing:1px;margin:0 0 6px 0;z-index:2;">SOCDOF</h1>
          <div style="display:inline-block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#8590F7;background:#1e1f22;padding:3px 10px;border-radius:6px;margin-bottom:24px;z-index:2;">Desktop Suite</div>

          <div id="startup-status-text" style="font-size:13px;font-weight:500;color:#DBDEE1;margin-bottom:14px;z-index:2;">
            Wird gestartet...
          </div>

          <!-- Progress Shimmer Bar (Discord Blurple) -->
          <div style="width:180px;height:4px;background:#35373c;border-radius:999px;overflow:hidden;position:relative;z-index:2;">
            <div style="height:100%;background:linear-gradient(90deg,#5865F2,#7289DA,#5865F2);border-radius:999px;position:absolute;animation:splashShimmer 1.5s cubic-bezier(0.4,0,0.2,1) infinite;"></div>
          </div>

          <div style="position:absolute;bottom:16px;font-size:9px;font-weight:500;color:#475569;letter-spacing:0.5px;">
            100% Offline • Strudelcode
          </div>
        </div>
        <script>
          try {
            var lang = (navigator.language || '').toLowerCase();
            var el = document.getElementById('startup-status-text');
            if (el) {
              if (lang.indexOf('en') === 0) el.textContent = 'Starting...';
              else if (lang.indexOf('fr') === 0) el.textContent = 'Démarrage...';
              else if (lang.indexOf('es') === 0) el.textContent = 'Iniciando...';
            }
          } catch (_) {}
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
